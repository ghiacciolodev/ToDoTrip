name: todotrip
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.0
  dio_cache_interceptor: ^4.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_map_cache: ^2.1.0
  flutter_map_marker_cluster: ^8.2.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  latlong2: ^0.9.1
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  # Builds AppLocalizations from the ARB files in lib/l10n on every build.
  generate: true
  assets:
    # Shipped as a file rather than as translation keys: it is one text that has
    # to stay identical to the copy reviewed in the repository, and splitting a
    # legal document across an ARB would guarantee the two drift apart.
    - assets/legal/
