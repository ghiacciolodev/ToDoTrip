[tool.pytest.ini_options]
# pythonpath lets tests import `app` without installing the package.
pythonpath = ["."]
testpaths = ["tests"]

# auto mode: async tests need no @pytest.mark.asyncio decorator.
asyncio_mode = "auto"

# Both scopes are "session" on purpose: asyncpg connections are bound to the
# event loop that created them, so fixtures and tests must share one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

# Warnings are failures. A suite that prints them trains everybody to scroll
# past the one that mattered, and CI should be silent or red, never noisy green.
#
# Anything genuinely out of our hands gets an explicit line below, so the list
# doubles as the record of what was decided and why.
filterwarnings = [
    "error",
    # Starlette's TestClient asks for httpx2. It is the only way to drive a
    # websocket from a test, the app itself does not use httpx at all, and
    # httpx2 is not released. Nothing to act on until it is.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear: likely bugs
    "SIM",  # simplifiable code
]
# B008 fires on FastAPI's Depends() in defaults, which is the intended pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files itself; their line length is not our style choice.
"alembic/versions/*" = ["E501"]