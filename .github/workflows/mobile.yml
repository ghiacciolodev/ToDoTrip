name: Mobile CI

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this is developed against. "stable" means
          # whatever shipped that morning, so a Flutter release could turn main
          # red on its own; bumping this is then a visible, reviewable commit.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check generated code is current
        # freezed, json_serializable and gen-l10n outputs are committed. Editing
        # a model or an ARB without regenerating leaves the build green and the
        # app running on stale code, which is the kind of bug that surfaces far
        # from its cause.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- . || {
            echo "::error::Generated files are out of date. Run build_runner and gen-l10n, then commit the result."
            exit 1
          }

      - name: Run tests
        run: flutter test
